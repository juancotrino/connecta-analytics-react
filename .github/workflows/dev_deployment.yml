name: Dev Deployment

on:
  push:
    branches: ['dev']

  pull_request:
    branches:
      - dev
    types:
      - closed

env:
  ENVIRONMENT: 'dev'
  PROJECT_ID: 'connecta-app-1' # TODO: update Google Cloud project id
  GAR_LOCATION: 'us-central1' # TODO: update Artifact Registry location
  SERVICE: 'connecta-app/react-frontend' # TODO: update Cloud Run service name
  REGION: 'us-central1' # TODO: update Cloud Run service region

jobs:
  deploy:
    name: Deploy
    # Add 'id-token' with the intended permissions for workload identity federation
    permissions:
      contents: 'read'
      id-token: 'write'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Google Auth
        id: auth
        uses: 'google-github-actions/auth@v2'

        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ secrets.WIF_PROVIDER }}' # e.g. - projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider
          service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}' # e.g. - my-service-account@my-project.iam.gserviceaccount.com

      - name: Get Secrets
        id: 'secrets'
        uses: 'google-github-actions/get-secretmanager-secrets@v2'
        with:
          secrets: |-
            FIREBASE_API_KEY:${{ env.PROJECT_ID }}/FIREBASE_API_KEY
            FIREBASE_AUTH_DOMAIN:${{ env.PROJECT_ID }}/FIREBASE_AUTH_DOMAIN
            FIREBASE_PROJECT_ID:${{ env.PROJECT_ID }}/FIREBASE_PROJECT_ID
            FIREBASE_STORAGE_BUCKET:${{ env.PROJECT_ID }}/FIREBASE_STORAGE_BUCKET
            FIREBASE_MESSAGING_SENDER_ID:${{ env.PROJECT_ID }}/FIREBASE_MESSAGING_SENDER_ID
            FIREBASE_APP_ID:${{ env.PROJECT_ID }}/FIREBASE_APP_ID

      # Authenticate Docker to Google Cloud Artifact Registry
      - name: Docker Auth
        id: docker-auth
        uses: 'docker/login-action@v2'
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.GAR_LOCATION }}-docker.pkg.dev'

      - name: Build and Push Container
        # --build-arg GH_PRIVATE_REPO_ACCESS=${{ secrets.GH_PRIVATE_REPO_ACCESS }} \
        run: |-
          docker build \
            -t "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}" ./
          docker push "${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}"
      # END - Docker auth and build
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: 'connecta-analytics-app'
          region: ${{ env.REGION }}
          # NOTE: If using a pre-built image, update the image name here
          image: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.SERVICE }}:${{ github.sha }}
          flags: |
            --allow-unauthenticated
            --memory=512Mi
            --cpu=1
            --concurrency=1
            --timeout=60
            --max-instances=1
            --service-account=${{ secrets.GCR_SERVICE_ACCOUNT }}
          env_vars: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ steps.secrets.outputs.FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ steps.secrets.outputs.FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ steps.secrets.outputs.FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ steps.secrets.outputs.FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ steps.secrets.outputs.FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ steps.secrets.outputs.FIREBASE_APP_ID }}
            NEXT_PUBLIC_LOG_LEVEL="NONE"

      - name: Show Output
        run: echo ${{ steps.deploy.outputs.url }}
